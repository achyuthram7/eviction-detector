# Render Blueprint (render.com → New → Blueprint → this repository).
# Prototype — synthetic data only. Not legal advice.
#
# One Docker web service on Render's free plan. The free plan has no persistent disk and sleeps
# after 15 minutes without visits, so the demo data, tests and reports are built into the image
# (SEED_AT_BUILD) and every restart or wake-up returns to the same clean demo, with the app's
# date fixed at the build date. Anything entered on the site is lost when it sleeps or restarts.
# QR codes and party links use Render's RENDER_EXTERNAL_URL unless PUBLIC_BASE_URL is set.
#
# To keep data between restarts instead: use a paid plan (e.g. 0.5c-512mb), add
#   disk: {name: appdata, mountPath: /app/data, sizeGB: 1}
# and the env var REPORTS_DIR=/app/data/reports. The first start then seeds onto the disk.
services:
  - type: web
    name: eviction-detector
    runtime: docker
    plan: free
    region: ohio # closest region to Indiana
    branch: main
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_AT_BUILD
        value: "true"
