{% extends "base.html" %}
{% block title %}Call queue{% endblock %}
{% block content %}
<h1>Call queue</h1>
<p class="muted">Sorted by days to the hearing, then settlement potential. Scores set call priority only — every case still gets the standard diversion offer.</p>
<form class="filters" hx-get="/staff/queue" hx-target="#queue-rows" hx-push-url="true" hx-trigger="change, submit, keyup changed delay:400ms from:#q">
  <label>Status
    <select name="status">
      <option value="">All open</option>
      {% for s in STATUSES %}<option value="{{ s }}"{% if filters.status == s %} selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
  </label>
  <label>Potential
    <select name="potential">
      <option value="">Any</option>
      {% for p in POTENTIALS %}<option value="{{ p }}"{% if filters.potential == p %} selected{% endif %}>{{ p }}</option>{% endfor %}
    </select>
  </label>
  <label>Pathway
    <select name="pathway">
      <option value="">Any</option>
      {% for p in PATHWAYS %}<option value="{{ p }}"{% if filters.pathway == p %} selected{% endif %}>{{ p }}</option>{% endfor %}
    </select>
  </label>
  <label>Case number
    <input id="q" name="q" value="{{ filters.q }}" placeholder="search" autocomplete="off">
  </label>
  <label class="choice"><input type="checkbox" name="show_closed" value="1"{% if filters.show_closed %} checked{% endif %}> Show closed</label>
  <noscript><button class="btn small" type="submit">Filter</button></noscript>
</form>
<div id="queue-rows">
  {% include "staff/_queue_rows.html" %}
</div>
{% endblock %}
