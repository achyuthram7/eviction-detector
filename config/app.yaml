# Application settings. Environment variables override paths and secrets (see core/settings.py).

# Synthetic case-number pattern (configurable). Default mirrors the Indiana layout.
case_number_regex: '^\d{2}[A-Z]\d{2}-\d{4}-EV-\d{6}$'
case_type: EV

# Small-claims cap. A claim equal to (or above) this is treated as "amount unknown".
claim_cap: 10000

# Staff roles that can sign in. TEMPORARY (November 2026): judge only, while the judge view is
# tested. To turn the other roles back on, list all four: [clerk, facilitator, judge, admin].
# The ACTIVE_STAFF_ROLES environment variable (comma-separated) overrides this list.
active_staff_roles: [judge]

# Restriction: a case is restricted when the feed sets confidential_flag or sealed_flag.
# Conservative option (Q B2): also restrict on these events before the flag arrives,
# e.g. [diversion_stay, dismissed]. Default: flags only, as the brief says.
restrict_on_events: []

diversion:
  status_check_days: [30, 60]   # calendar days (Q B4 default)
  stay_days: 90
  # Reconciliation: flag a case marked "both agreed to diversion" in the tool if the feed
  # has not shown diversion_stay within this many days.
  confirm_within_days: 7

# Purge intake details this many days after a case closes (PLACEHOLDER, Q B5).
retention_days: 90

# Map of disposition_type codes in the export -> working status.
# PLACEHOLDER codes: replace with the codes the real Odyssey export uses (Q B3).
# resolved = counts as a positive "resolved / settled" label for the model (Q A1 default:
# agreed judgments and every dismissal).
dispositions:
  agreed_pay_and_stay:   {resolved: true,  status: Settled,         subtype: pay-and-stay}
  agreed_move_out:       {resolved: true,  status: Settled,         subtype: move-out}
  dismissed_on_payment:  {resolved: true,  status: Settled,         subtype: dismissed on payment}
  dismissed_other:       {resolved: true,  status: Closed,          subtype: dismissed}
  default_judgment:      {resolved: false, status: No settlement,   subtype: default judgment}
  judgment_after_trial:  {resolved: false, status: No settlement,   subtype: judgment after trial}

# Used when disposition_type is blank or unknown: label + status come from the event.
resolved_events: [agreed_judgment, dismissed]
